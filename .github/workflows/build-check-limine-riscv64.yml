name: Build check for Limine RISC-V 64

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            clang \
            cmake \
            pkg-config \
            nasm \
            xorriso \
            mtools \
            binutils-riscv64-unknown-elf
          rustup target add riscv64gc-unknown-none-elf

      - name: Check RISC-V toolchain
        run: |
          clang --version
          clang --target=riscv64-unknown-elf --version
          riscv64-unknown-elf-ld --version
          riscv64-unknown-elf-objcopy --version

      - name: Generate default configuration
        run: make defconfig

      - name: Build project
        run: |
          make BOOTLOADER=limine ARCH=riscv64 \
            CC=clang \
            LD=riscv64-unknown-elf-ld \
            AS=clang \
            C_TARGET=riscv64-unknown-elf \
            AR=riscv64-unknown-elf-ar \
            OBJCOPY=riscv64-unknown-elf-objcopy \
            -j$(nproc)
